name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check dfharness tests dfctl dfhack-run
      - run: uv run --locked ruff format --check dfharness tests dfctl dfhack-run
      - run: uv run --locked ty check
      - run: uv run --locked vulture
      - run: uv run --locked python -m unittest discover -v
      - run: uv build

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lunarmodules/luacheck@v1
        with:
          args: dfharness tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck df-ascii
